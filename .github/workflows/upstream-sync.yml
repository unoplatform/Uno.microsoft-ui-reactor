name: Sync upstream into uno

# Keeps `uno` current with Microsoft's `main` (microsoft/microsoft-ui-reactor).
# Adapted from unoplatform/uno's master-sync.yml (master -> feature/* branches).
#
# It maintains ONE pull request whose merge brings the latest upstream `main` in:
#   - Builds a disposable `automation/upstream-sync` branch by *raw git merge* of
#     upstream `main` into `uno` (keeps upstream in the merge ancestry, so each
#     sync only brings what is new).
#   - Clean merge  -> ready PR + auto-merge (merge-commit method).
#   - Conflicts    -> commits the conflict markers, opens the PR as a DRAFT so a
#     half-merge can never auto-land, labels it and pings once.
#   - Already current / nothing new -> closes the PR and deletes the branch.
#   - A human's pushed resolution on the sync branch is never clobbered: when the
#     sync branch carries non-bot commits, the next run re-merges upstream *on top*
#     of their work instead of resetting to `uno`.
#
# Upstream is fetched straight from Microsoft's repository; this fork's `main`
# is not used and is not updated.
#
# Excluded PRs: EXCLUDED_UPSTREAM_PRS below lists Microsoft PRs `uno` must not take.
# Each is recorded as merged with `git merge -s ours` right after merging its parent,
# so ancestry stays intact and later syncs only bring in what came after it. This
# needs a merge-commit or squash merged PR; for a rebase-merged one only its last
# commit would be skipped.
#
# Token: provide a `SYNC_BOT_TOKEN` secret, a PAT (classic: `repo` + `workflow`;
# fine-grained: Contents, Issues, Pull requests and Workflows, all read/write). An App
# token expires within the hour, so it would need a step generating it first.
# The default GITHUB_TOKEN is the fallback but is NOT sufficient:
#   - GitHub rejects its push whenever the sync brings a change to .github/workflows/**
#     ("refusing to allow a GitHub App to create or update workflow"), and `workflows`
#     is not a grantable `permissions:` key.
#   - It cannot open the PR while "Allow GitHub Actions to create and approve pull
#     requests" is off ("Resource not accessible by integration").
#   - Its pushes and PRs do not trigger GitHub Actions, and the required checks here
#     ARE GitHub Actions, so this workflow starts them itself through workflow_dispatch;
#     their check runs land on the PR's head commit. Skipped under SYNC_BOT_TOKEN.
#
# Repo prerequisite: Settings -> General -> "Allow auto-merge" must be ON.

on:
  schedule:
    - cron: '0 4 * * *' # nightly 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and log what would happen but make no changes'
        type: boolean
        required: false
        default: false

env:
  # PR numbers of microsoft/microsoft-ui-reactor kept out of `uno`, separated by commas
  # or spaces. The value holds numbers only, so say why in a comment above it:
  #   1234: breaks the Uno build until <what>
  EXCLUDED_UPSTREAM_PRS: ''

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  # Microsoft's workflows stay in the tree for clean syncs, but must not run here.
  # GitHub registers a workflow only the first time its trigger fires, so they
  # cannot all be switched off up front; this job switches off any that appeared
  # since the last run (including ones Microsoft adds later).
  keep-only-our-workflows:
    name: Keep Microsoft's workflows off
    if: github.repository == 'unoplatform/Uno.microsoft-ui-reactor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Switch off workflows that are not ours
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # The workflows this fork runs; every other one comes from microsoft/microsoft-ui-reactor.
          # A new workflow file of ours goes here, called ones too (ci-uno-consume.yml), and in the
          # "Ours" list of src/Reactor.Uno/MAINTAINING.md ("Our workflows on this fork").
          KEEP: ci-uno.yml ci-uno-consume.yml conventional-commits.yml label-upstream-files.yml upstream-sync.yml
        run: |
          set -euo pipefail
          count=0
          while IFS=$'\t' read -r id path; do
            [ -z "${id:-}" ] && continue
            # GitHub's built-in workflows (Code Quality, ...) are not files in the repo.
            case "$path" in dynamic/*) continue ;; esac
            name="${path##*/}"
            case " $KEEP " in *" $name "*) continue ;; esac
            if [ "$DRY_RUN" = "true" ]; then
              echo "would switch off $path"
            else
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable"
              echo "switched off $path"
            fi
            count=$((count + 1))
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows" \
                     --jq '.workflows[] | select(.state == "active") | "\(.id)\t\(.path)"')
          {
            echo "### Microsoft's workflows"
            echo "Switched off this run: ${count}"
          } >> "$GITHUB_STEP_SUMMARY"

  sync:
    name: Sync upstream main into uno
    if: github.repository == 'unoplatform/Uno.microsoft-ui-reactor'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write # start the checks on the sync branch
      issues: write # labels are an Issues API operation
    env:
      # Swap-seam: SYNC_BOT_TOKEN (PAT/App) wins if present, else the default token.
      SYNC_TOKEN: ${{ secrets.SYNC_BOT_TOKEN || github.token }}
      HAS_BOT_TOKEN: ${{ secrets.SYNC_BOT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: uno
          fetch-depth: 0
          token: ${{ env.SYNC_TOKEN }}

      - name: Preflight — verify auto-merge is allowed
        shell: bash
        env:
          GH_TOKEN: ${{ env.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          allowed="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge' 2>/dev/null || echo unknown)"
          if [ "$allowed" != "true" ]; then
            echo "::warning::Repository 'Allow auto-merge' is '${allowed}'. Sync PRs will be created but cannot auto-merge until it is enabled (Settings → General → Allow auto-merge)."
            echo "> ⚠️ **Allow auto-merge is not enabled** — sync PRs will need manual merge." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sync upstream main into uno
        shell: bash
        env:
          GH_TOKEN: ${{ env.SYNC_TOKEN }}
          # The step adds a git remote named `upstream`, and gh prefers it over `origin`:
          # without this, gh pr list/create/edit act on microsoft/microsoft-ui-reactor.
          GH_REPO: ${{ github.repository }}
          # Reads Microsoft's public PRs: a fine-grained PAT may be refused across orgs.
          UPSTREAM_READ_TOKEN: ${{ github.token }}
          TARGET: uno
          UPSTREAM_REPO: microsoft/microsoft-ui-reactor
          UPSTREAM_BRANCH: main
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PING: '@Xiaoy312'
          REVIEWER: Xiaoy312
          BOT_NAME: 'github-actions[bot]'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          SYNC_BRANCH="automation/upstream-sync"
          SOURCE="upstream/${UPSTREAM_BRANCH}"
          TITLE="chore(automation): Sync microsoft/microsoft-ui-reactor ${UPSTREAM_BRANCH} → ${TARGET}"
          CMARKER="<!-- upstream-sync-bot:conflict -->"
          PMARKER="<!-- upstream-sync-bot:push-failed -->"
          # Trailer on every bot commit that contains conflict markers.
          CONFLICT_TRAILER="Upstream-Sync-Conflict: unresolved"
          EXCLUDE_SUBJECT="chore(automation): Exclude"

          # Guarantee exactly ONE summary row, however we exit.
          STATUS=""
          note() { STATUS="$1"; }
          trap '{ echo "### \`${TARGET}\`"; echo "${STATUS:-❌ errored — see logs}"; } >> "$GITHUB_STEP_SUMMARY"' EXIT

          git config user.name "$BOT_NAME"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote add upstream "${GITHUB_SERVER_URL}/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          git fetch origin "${TARGET}" --prune
          git fetch origin "${SYNC_BRANCH}" >/dev/null 2>&1 || true

          # gh pr lookup that never aborts the step (set -e safe).
          open_pr() { gh pr list --head "$SYNC_BRANCH" --base "$TARGET" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true; }

          # Stop PR $1 from landing. Checks the outcome, not gh's exit codes: asking for a
          # state the PR is already in can fail too.
          quarantine_pr() {
            gh pr ready "$1" --undo >/dev/null 2>&1 || true
            gh pr merge "$1" --disable-auto >/dev/null 2>&1 || true
            if [ "$(gh pr view "$1" --json isDraft,autoMergeRequest --jq '.isDraft and .autoMergeRequest == null' 2>/dev/null || true)" != "true" ]; then
              echo "::warning::Could not quarantine PR #$1, so it may still merge. Convert it to a draft by hand."
            fi
          }

          # Open the sync PR with body $1 and extra gh arguments; a refusal ends the run.
          create_pr() {
            local body="$1" why
            shift
            if gh pr create --base "$TARGET" --head "$SYNC_BRANCH" "$@" --title "$TITLE" --body "$body"; then
              return 0
            fi
            if [ "$HAS_BOT_TOKEN" != "true" ]; then
              why="the default GITHUB_TOKEN may not open PRs while 'Allow GitHub Actions to create and approve pull requests' is off — provision the SYNC_BOT_TOKEN secret (see this workflow's header)"
            else
              why="see the gh output above"
            fi
            echo "::error title=upstream-sync PR create failed::${why}"
            note "❌ PR create failed — ${why}. The branch is pushed; [open the PR by hand](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${TARGET}...${SYNC_BRANCH}?expand=1) and later runs keep it updated."
            exit 1
          }

          # Our labels (idempotent).
          ensure_labels() {
            gh label create 'upstream-sync' --color '1d76db' --description 'Automated upstream main→uno sync PR' --force >/dev/null 2>&1 || true
            gh label create 'conflicts'     --color 'b60205' --description 'Automated merge hit conflicts'        --force >/dev/null 2>&1 || true
          }

          # Labels and reviewer for PR $1 (best-effort); $2 = 1 when it has conflicts.
          label_pr() {
            gh pr edit "$1" --add-label 'upstream-sync' >/dev/null 2>&1 || true
            if [ "$2" = "1" ]; then
              gh pr edit "$1" --add-label 'conflicts' >/dev/null 2>&1 || true
            else
              gh pr edit "$1" --remove-label 'conflicts' >/dev/null 2>&1 || true
            fi
            gh pr edit "$1" --add-reviewer "$REVIEWER" >/dev/null 2>&1 || true
          }

          # One-time sticky comment so a human is pinged exactly once.
          ping_conflict() {
            local existing
            existing="$(gh pr view "$1" --json comments --jq "[.comments[] | select(.body | contains(\"$CMARKER\"))] | length" 2>/dev/null || echo 0)"
            if [ "${existing:-0}" = "0" ]; then
              gh pr comment "$1" --body "$(printf '%s\n' "$CMARKER" \
                "${PING} — upstream \`${UPSTREAM_BRANCH}\` has merge conflicts into \`${TARGET}\`. This sync PR is a draft; see its description for the resolution steps.")" \
                >/dev/null 2>&1 || true
            fi
          }

          # Start the required checks on the sync branch. Only needed with the default
          # token: its pushes and PRs do not trigger GitHub Actions.
          start_checks() {
            if [ "$HAS_BOT_TOKEN" = "true" ]; then return 0; fi
            gh workflow run ci-uno.yml --ref "$SYNC_BRANCH" \
              || echo "::warning::Could not start ci-uno.yml on ${SYNC_BRANCH}."
            gh workflow run conventional-commits.yml --ref "$SYNC_BRANCH" \
              || echo "::warning::Could not start conventional-commits.yml on ${SYNC_BRANCH}."
          }

          # --- 1. Already current: target already contains upstream -> nothing to do. ---
          if git merge-base --is-ancestor "$SOURCE" "origin/${TARGET}"; then
            pr="$(open_pr)"
            if [ -n "$pr" ]; then
              if [ "$DRY_RUN" = "true" ]; then
                note "already current — would close stale PR #$pr (dry-run)"
              else
                gh pr close "$pr" --comment "\`${TARGET}\` is already up to date with upstream \`${UPSTREAM_BRANCH}\`; closing this sync PR." --delete-branch || true
                note "already current — closed stale PR #$pr"
              fi
            else
              note "already current — nothing to do"
            fi
            exit 0
          fi

          # Upstream PR numbers mean nothing on this fork, so a bare #N would link to the
          # wrong PR, and a plain link would add a backlink to Microsoft's PR on every
          # sync. redirect.github.com is GitHub's own way to link without one.
          pr_link() { printf '[#%s](https://redirect.github.com/%s/pull/%s)' "$1" "$UPSTREAM_REPO" "$1"; }

          # Excluded upstream PRs, resolved to their merge commits and kept while still
          # pending (upstream, not yet in the target). gh's own error stays visible, so an
          # auth or rate-limit failure doesn't read like a typo in the list.
          EXCLUDED_SHAS=()
          excluded_list=""
          excluded_prs="$EXCLUDED_UPSTREAM_PRS"
          for n in ${excluded_prs//,/ }; do
            if ! [[ "$n" =~ ^[0-9]+$ ]]; then
              note "❌ \`$n\` in EXCLUDED_UPSTREAM_PRS is not a PR number"
              exit 1
            fi
          done
          for n in ${excluded_prs//,/ }; do
            upstream_pr="$(GH_TOKEN="$UPSTREAM_READ_TOKEN" gh pr view "$n" --repo "$UPSTREAM_REPO" --json state,mergeCommit --jq '[.state, .mergeCommit.oid // ""] | @tsv')" \
              || { note "❌ could not read excluded PR ${UPSTREAM_REPO}#$n — see the gh error in the logs"; exit 1; }
            IFS=$'\t' read -r pr_state sha <<<"$upstream_pr"
            case "$pr_state" in
              MERGED) ;;
              OPEN)
                echo "::warning::Excluded PR ${UPSTREAM_REPO}#$n is still open; it takes effect once it merges."
                continue
                ;;
              *)
                note "❌ excluded PR ${UPSTREAM_REPO}#$n was closed without merging — remove it from EXCLUDED_UPSTREAM_PRS"
                exit 1
                ;;
            esac
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              note "❌ excluded PR ${UPSTREAM_REPO}#$n has no reachable merge commit"
              exit 1
            fi
            if git merge-base --is-ancestor "$sha" "origin/${TARGET}"; then
              # Landed either as our exclusion record or, too late, with its changes.
              if grep -qF " $sha" <<<"$(git log --merges --grep="^${EXCLUDE_SUBJECT} " --format=%P "origin/${TARGET}")"; then
                excluded_list="${excluded_list} $(pr_link "$n")"
              else
                echo "::warning::Excluded PR ${UPSTREAM_REPO}#$n is already in ${TARGET}, so excluding it does nothing. To take it out, revert it."
              fi
              continue
            fi
            excluded_list="${excluded_list} $(pr_link "$n")"
            if git merge-base --is-ancestor "$sha" "$SOURCE"; then
              EXCLUDED_SHAS+=("$sha")
            fi
          done
          # Ancestry order (oldest first), so each `^1` merge never pulls in a later exclusion.
          if [ "${#EXCLUDED_SHAS[@]}" -gt 0 ]; then
            pending="$(printf '%s\n' "${EXCLUDED_SHAS[@]}")"
            ordered="$(git rev-list --topo-order --reverse "$SOURCE" --not "origin/${TARGET}")"
            mapfile -t EXCLUDED_SHAS < <(grep -Fxf <(printf '%s\n' "$pending") <<<"$ordered" || true)
          fi

          # What a sync up to $1 really brings: excluded PRs' own commits don't count.
          # Fills incoming and range.
          describe_sync() {
            local sha
            incoming="$(grep -cFxvf <(for sha in "${EXCLUDED_SHAS[@]}"; do git rev-list "$sha" "^${sha}^1"; done) \
                          <<<"$(git rev-list "$1" --not "origin/${TARGET}")" || true)"
            range="$(git rev-parse --short "origin/${TARGET}")..$(git rev-parse --short "$1")"
          }
          describe_sync "$SOURCE"

          # PRs a sync up to $1 brings in, from upstream's first-parent history: squash
          # merges ("Title (#N)") and merge commits ("Merge pull request #N", title in the
          # body). Fills pr_total and pr_lines.
          # Cap by entries and by characters: GitHub rejects bodies over 65,536 chars,
          # which would fail `gh pr create`. 50,000 leaves room for the rest of the body.
          MAX_PR_LINES=250
          PR_LIST_BUDGET=50000
          build_pr_list() {
            local upto="$1" c subject n t line pr_listed=0 pr_chars=0 pr_full=0
            pr_lines=()
            pr_total=0
            for c in $(git rev-list --first-parent --reverse "$upto" --not "origin/${TARGET}"); do
              subject="$(git show -s --format=%s "$c")"
              if [[ "$subject" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
                n="${BASH_REMATCH[1]}"
                t="$(git show -s --format=%b "$c")"
                t="${t#"${t%%[![:space:]]*}"}"
                t="${t%%$'\n'*}"
              elif [[ "$subject" =~ \(\#([0-9]+)\)$ ]]; then
                n="${BASH_REMATCH[1]}"
                t="${subject% (#*}"
              else
                continue
              fi
              pr_total=$(( pr_total + 1 ))
              if [ "$pr_full" = "1" ] || [ "$pr_listed" -ge "$MAX_PR_LINES" ]; then
                pr_full=1
                continue
              fi
              # Escape & first so entities already in a title (&#64;name decodes to a
              # mention) stay literal, then < so generics like List<T> aren't swallowed as
              # HTML tags, then break @mentions and #refs with an empty comment: a #N or
              # owner/repo@sha in Microsoft's title must not autolink from this fork.
              # sed, because bash 5.2 expands & in ${//}.
              t="$(sed 's/&/\&amp;/g; s/</\&lt;/g; s/@/@<!-- -->/g; s/#/#<!-- -->/g' <<<"$t")"
              if [[ " ${excluded_prs//,/ } " == *" ${n} "* ]]; then
                line="- ~~$(pr_link "$n")~~ ${t} — _excluded_"
              else
                line="- $(pr_link "$n") ${t}"
              fi
              if [ $(( pr_chars + ${#line} + 1 )) -gt "$PR_LIST_BUDGET" ]; then
                pr_full=1
                continue
              fi
              pr_chars=$(( pr_chars + ${#line} + 1 ))
              pr_lines+=("$line")
              pr_listed=$(( pr_listed + 1 ))
            done
            if [ "$pr_listed" -lt "$pr_total" ]; then
              pr_lines+=("- …and $(( pr_total - pr_listed )) more, see the [full comparison](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${TARGET}...$(git rev-parse "$upto")).")
            elif [ "$pr_total" -eq 0 ]; then
              pr_lines+=("_No PR merges in this range._")
            fi
          }

          # Does the existing sync branch carry non-bot (human resolution) commits?
          HAS_HUMAN_WORK=0
          SYNC_EXISTS=0
          if git rev-parse --verify --quiet "origin/${SYNC_BRANCH}" >/dev/null; then
            SYNC_EXISTS=1
            # Commits unique to the sync branch are the bot's merge commit(s) plus any
            # human resolution. List their committer names and drop the bot's; whatever
            # remains is human work. (--invert-grep only inverts --grep, NOT
            # --committer, so a committer filter cannot be used here.)
            if [ -n "$(git log --format='%cn' \
                        "origin/${SYNC_BRANCH}" --not "origin/${TARGET}" "$SOURCE" 2>/dev/null \
                        | grep -vxF "$BOT_NAME" || true)" ]; then
              HAS_HUMAN_WORK=1
            fi
          fi

          # Was $1 recorded in the sync branch as an `-s ours` merge (tree unchanged)?
          excluded_in_sync() {
            local c p1 rest p
            while read -r c p1 rest; do
              for p in $rest; do
                if [ "$p" = "$1" ] && [ "$(git rev-parse "${c}^{tree}")" = "$(git rev-parse "${p1}^{tree}")" ]; then
                  return 0
                fi
              done
            done < <(git rev-list --parents "origin/${SYNC_BRANCH}" --not "origin/${TARGET}")
            return 1
          }

          # An exclusion added after the sync branch already took that PR in: rebuild
          # from the target tip, dropping the sync branch (and any human resolution on it).
          TAINTED=""
          if [ "$SYNC_EXISTS" = "1" ]; then
            for sha in "${EXCLUDED_SHAS[@]}"; do
              if git merge-base --is-ancestor "$sha" "origin/${SYNC_BRANCH}" && ! excluded_in_sync "$sha"; then
                TAINTED="${TAINTED} $(git rev-parse --short "$sha")"
              fi
            done
          fi
          # An exclusion removed while the sync branch still holds its record: as it stands
          # that PR would land as dropped for good, so rebuild to bring it back.
          UNEXCLUDED=""
          if [ "$SYNC_EXISTS" = "1" ]; then
            while read -r _ recorded; do
              case " ${EXCLUDED_SHAS[*]} " in
                *" $recorded "*) ;;
                *) UNEXCLUDED="${UNEXCLUDED} $(git rev-parse --short "$recorded")" ;;
              esac
            done < <(git log --merges --grep="^${EXCLUDE_SUBJECT} " --format=%P "origin/${SYNC_BRANCH}" --not "origin/${TARGET}")
          fi
          if [ -n "$TAINTED$UNEXCLUDED" ]; then
            if [ -n "$TAINTED" ]; then
              echo "::warning::${SYNC_BRANCH} already contains excluded commit(s)${TAINTED}; rebuilding from ${TARGET}."
            fi
            if [ -n "$UNEXCLUDED" ]; then
              echo "::warning::${SYNC_BRANCH} records exclusion(s) no longer listed${UNEXCLUDED}; rebuilding from ${TARGET}."
            fi
            HAS_HUMAN_WORK=0
            # A rejected push would leave the old head free to land, so hold it first.
            # A clean rebuild makes the PR ready and re-arms auto-merge further down.
            if [ "$DRY_RUN" != "true" ]; then
              pr="$(open_pr)"
              if [ -n "$pr" ]; then
                quarantine_pr "$pr"
              fi
            fi
          fi

          # Conflict markers the bot committed on top of earlier human work are still
          # unresolved until a human commits after them. Re-merging on top would look
          # clean and un-draft the PR, so leave the branch alone and keep it quarantined.
          if [ "$HAS_HUMAN_WORK" = "1" ]; then
            conflicts="$(git log --format='%H%x09%cn' --grep="^${CONFLICT_TRAILER}\$" \
                           "origin/${SYNC_BRANCH}" --not "origin/${TARGET}" "$SOURCE")"
            last_conflict="$(awk -F'\t' -v b="$BOT_NAME" '$2 == b { print $1; exit }' <<<"$conflicts")"
            if [ -n "$last_conflict" ] \
               && [ -z "$(git log --format='%cn' "${last_conflict}..origin/${SYNC_BRANCH}" | grep -vxF "$BOT_NAME" || true)" ]; then
              pr="$(open_pr)"
              if [ "$DRY_RUN" != "true" ]; then
                if [ -n "$pr" ]; then
                  quarantine_pr "$pr"
                else
                  # An earlier run's PR create was refused: without a PR nothing points at
                  # the conflict. Open it here, the normal path would re-merge on top.
                  ensure_labels
                  create_pr "$(printf '%s\n' \
                    "> [!WARNING]" \
                    "> **Merge conflicts** — \`${SYNC_BRANCH}\` has conflict markers committed. Resolve them there and push; the next run continues from your work." \
                    "" \
                    "_Maintained automatically; updates in place. Generated by [this run](${RUN_URL})._")" --draft
                  pr="$(open_pr)"
                  label_pr "$pr" 1
                  ping_conflict "$pr"
                fi
              fi
              note "⚠️ waiting for conflict resolution on \`${SYNC_BRANCH}\`${pr:+ — PR #$pr kept as draft}"
              exit 0
            fi
          fi

          # --- 2. No-op guard: sync branch already contains BOTH current upstream and
          #        current target tip -> don't rebuild/force-push (avoids restarting CI
          #        or dismissing a pending approval). Just ensure PR + auto-merge state.
          #        Without an open PR there is nothing to protect: carry on and open one. ---
          pr="$(open_pr)"
          if [ -n "$pr" ] && [ "$SYNC_EXISTS" = "1" ] && [ -z "$TAINTED$UNEXCLUDED" ] \
             && git merge-base --is-ancestor "$SOURCE" "origin/${SYNC_BRANCH}" \
             && git merge-base --is-ancestor "origin/${TARGET}" "origin/${SYNC_BRANCH}"; then
            is_draft="$(gh pr view "$pr" --json isDraft --jq '.isDraft' 2>/dev/null || echo '')"
            if [ "$DRY_RUN" != "true" ]; then
              # The branch is confirmed current, so a `sync-failed` from an earlier run is
              # stale no matter who fixed it.
              gh pr edit "$pr" --remove-label 'sync-failed' >/dev/null 2>&1 || true
              if [ "$is_draft" != "true" ]; then
                gh pr merge "$pr" --auto --merge >/dev/null 2>&1 || true
              fi
            fi
            note "up to date — PR #$pr unchanged"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            build_pr_list "$SOURCE"
            {
              echo "### Would include (${pr_total})"
              echo
              printf '%s\n' "${pr_lines[@]}"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            note "would sync ${incoming} commit(s) [\`$range\`] (dry-run)"
            exit 0
          fi

          # --- 3. Build the sync branch by RAW merge (ancestry-preserving). When a human
          #        resolution exists, base on the sync branch so their work is preserved. ---
          if [ "$HAS_HUMAN_WORK" = "1" ]; then
            git checkout -B "$SYNC_BRANCH" "origin/${SYNC_BRANCH}"
          else
            git checkout -B "$SYNC_BRANCH" "origin/${TARGET}"
          fi

          CONFLICT=0
          conflict_files=""
          merge_in() {
            if git merge --no-ff --no-edit -m "Merge ${UPSTREAM_REPO} $2 into ${TARGET}" "$1"; then
              return 0
            # Test for unmerged entries via command substitution, never a pipe: under
            # `pipefail` a reader that exits early (`grep -q`) can SIGPIPE the producer,
            # and the 141 becomes the pipeline's status — reporting a conflicted merge
            # as clean and dropping us into the "non-conflict failure" branch below.
            elif [ -n "$(git ls-files -u)" ]; then
              CONFLICT=1
              conflict_files="$(git diff --name-only --diff-filter=U || true)"
              git add -A
              git commit --no-edit --trailer "$CONFLICT_TRAILER" || { git merge --abort 2>/dev/null || true; note "❌ conflict commit failed"; exit 1; }
            else
              git status --short || true
              git merge --abort 2>/dev/null || true
              note "❌ merge failed (non-conflict) — see logs"
              exit 1
            fi
          }

          # Excluded PRs: bring in upstream up to each one, then record it as merged
          # without its changes. A conflict stops here; once resolved, the next run
          # continues from the human's work.
          PARTIAL=""
          for sha in "${EXCLUDED_SHAS[@]}"; do
            if git merge-base --is-ancestor "$sha" HEAD; then
              continue
            fi
            merge_in "${sha}^1" "$(git rev-parse --short "${sha}^1")"
            if [ "$CONFLICT" = "1" ]; then
              PARTIAL="$(git rev-parse --short "${sha}^1")"
              break
            fi
            git merge --no-ff -s ours \
              -m "${EXCLUDE_SUBJECT} $(git rev-parse --short "$sha") from ${TARGET}" \
              -m "Records '$(git log -1 --format=%s "$sha")' as merged without its changes." "$sha"
          done

          if [ -z "$PARTIAL" ]; then
            merge_in "$SOURCE" "$UPSTREAM_BRANCH"
          fi

          # Quarantine BEFORE publishing a conflicted tree: demote an existing ready PR to
          # draft and disable any prior auto-merge, so a half-merge can never auto-land.
          if [ "$CONFLICT" = "1" ] && [ -n "$pr" ]; then
            quarantine_pr "$pr"
          fi

          # A rejected push must name its cause and mark the PR, or the run just goes red
          # while the PR keeps advertising a stale body.
          # Compare against the ref this push replaces: when the sync branch already exists
          # HEAD can carry workflow files it already has, which are not new to this push.
          if [ "$SYNC_EXISTS" = "1" ]; then
            wf_base="origin/${SYNC_BRANCH}"
          else
            wf_base="origin/${TARGET}"
          fi
          wf_changed="$(git diff --name-only "${wf_base}..HEAD" -- '.github/workflows' || true)"
          if ! git push --force-with-lease origin "HEAD:refs/heads/${SYNC_BRANCH}"; then
            if [ -n "$wf_changed" ] && [ "$HAS_BOT_TOKEN" != "true" ]; then
              why="the merge updates .github/workflows/** and the default GITHUB_TOKEN may not push workflow files — provision the SYNC_BOT_TOKEN secret (see this workflow's header)"
            else
              why="see the git output above"
            fi
            echo "::error title=upstream-sync push rejected::${why}"
            gh label create 'sync-failed' --color 'b60205' --description 'Automated upstream sync could not complete' >/dev/null 2>&1 || true
            if [ -n "$pr" ]; then
              gh pr edit "$pr" --add-label 'sync-failed' >/dev/null 2>&1 || true
              seen="$(gh pr view "$pr" --json comments --jq "[.comments[] | select(.body | contains(\"$PMARKER\"))] | length" 2>/dev/null || echo 0)"
              if [ "${seen:-0}" = "0" ]; then
                gh pr comment "$pr" --body "$(printf '%s\n' "$PMARKER" \
                  "> [!CAUTION]" \
                  "> **This sync PR is stale.** The nightly job could not push an update: ${why}." \
                  "" \
                  "Its description below describes an older sync and must not be trusted until this is resolved. [Failing run](${RUN_URL})")" \
                  >/dev/null 2>&1 || true
              fi
            fi
            note "❌ push rejected — ${why}"
            exit 1
          fi
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --remove-label 'sync-failed' >/dev/null 2>&1 || true
          fi

          ensure_labels

          # --- 4. Body (printf-built; indented to stay inside the YAML block scalar). ---
          if [ "$CONFLICT" = "1" ]; then
            detail="$(printf '%s\n' \
              "> [!WARNING]" \
              "> **Merge conflicts** — opened as a **draft** so it cannot auto-merge. Resolve, then mark *Ready for review*." \
              "" \
              "Conflicted files:" \
              '```' \
              "$conflict_files" \
              '```' \
              "" \
              "Resolve locally (the merge is already committed *with* the conflict markers):" \
              '```bash' \
              "git fetch origin" \
              "git checkout ${SYNC_BRANCH}" \
              "# Open the conflicted files, resolve all <<<<<<< / ======= / >>>>>>> markers, then:" \
              "git add -u" \
              "git commit -m 'fix: resolve merge conflicts with upstream'" \
              "git push" \
              '```')"
          else
            detail="- Auto-merge: **enabled** — lands once required CI is green and a reviewer approves."
          fi

          extra=()
          if [ "$HAS_BOT_TOKEN" != "true" ]; then
            extra+=("- Checks: started by the sync workflow (the default token's pushes do not trigger them)")
          fi
          if [ -n "$excluded_list" ]; then
            extra+=("- Upstream PRs **excluded** from \`${TARGET}\` (recorded as merged, changes dropped):${excluded_list}")
          fi
          if [ -n "$TAINTED" ]; then
            extra+=("- **Rebuilt:** the previous sync branch already contained newly excluded commit(s)${TAINTED}, so it was rebuilt from \`${TARGET}\`; any conflict resolution pushed to it must be redone.")
          fi
          if [ -n "$UNEXCLUDED" ]; then
            extra+=("- **Rebuilt:** the previous sync branch recorded exclusion(s) no longer listed${UNEXCLUDED}, so it was rebuilt from \`${TARGET}\`; any conflict resolution pushed to it must be redone.")
          fi
          if [ -n "$PARTIAL" ]; then
            describe_sync "$PARTIAL"
            extra+=("- **Partial:** stopped at \`${PARTIAL}\` (just before an excluded PR) because of conflicts; the next run continues after you push a resolution.")
            build_pr_list "$PARTIAL"
          else
            build_pr_list "$SOURCE"
          fi

          body="$(printf '%s\n' \
            "Automated sync — merges the latest \`${UPSTREAM_BRANCH}\` of [${UPSTREAM_REPO}](${GITHUB_SERVER_URL}/${UPSTREAM_REPO}) into \`${TARGET}\`." \
            "" \
            "- Incoming commits from upstream: **${incoming}**" \
            "- Range: \`${range}\`" \
            "- Merge method: **merge commit** (preserves ancestry so future syncs stay minimal)" \
            "${extra[@]}" \
            "" \
            "${detail}" \
            "" \
            "### Included upstream PRs (${pr_total})" \
            "" \
            "${pr_lines[@]}" \
            "" \
            "_Maintained automatically; updates in place. Generated by [this run](${RUN_URL})._")"

          # --- 5. Create or update the PR. Create with the minimum so a label/reviewer
          #        issue can never sink creation; add labels + reviewer best-effort after. ---
          if [ -z "$pr" ]; then
            draft=()
            if [ "$CONFLICT" = "1" ]; then
              draft=(--draft)
            fi
            create_pr "$body" "${draft[@]}"
            pr="$(open_pr)"
          else
            gh pr edit "$pr" --title "$TITLE" --body "$body" >/dev/null \
              || echo "::warning::Could not update the description of PR #$pr; it still lists the previous sync."
            if [ "$CONFLICT" != "1" ]; then
              gh pr ready "$pr" >/dev/null 2>&1 || true
            fi
          fi

          label_pr "$pr" "$CONFLICT"

          # The pushed head has no checks yet: start them.
          start_checks

          if [ "$CONFLICT" = "1" ]; then
            ping_conflict "$pr"
            note "⚠️ conflicts (${incoming} commits) — draft PR #${pr:-?}"
          else
            if [ -n "$pr" ]; then
              gh pr merge "$pr" --auto --merge >/dev/null 2>&1 \
                || echo "::warning::Could not enable auto-merge on PR #$pr (check 'Allow auto-merge' / rulesets / token)."
            fi
            note "✅ synced ${incoming} commits [\`$range\`] — PR #${pr:-?}"
          fi
