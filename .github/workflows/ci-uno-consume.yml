name: CI (Uno) - consume the package

# Called by ci-uno.yml after its `pack` job; not triggered on its own. It runs in the caller's
# workflow run, so it can download the run's `NuGet` artifact.
#
# Each job takes a sample out of the repo the way the docs tell a consumer to: Reactor from the
# `Reactor` UnoFeature on the Uno.Sdk the package readme pins, with `UnoReactorVersion=<version>` so
# the feature takes the packed package, restored into a private NUGET_PACKAGES in a folder outside
# the checkout. The repo build (build-uno, build-mobile) compiles every head from source; these
# jobs are what uses each of the package's lib/ folders.
#   - desktop (file-based): .github/scripts/uno/smoke-package.ps1 builds samples/Uno/file-based/Counter.cs
#     in the package readme's form, runs it, and clicks "+" through UI Automation.
#   - wasm / android / ios: .github/scripts/uno/build-package.ps1 builds samples/Uno/ReactorUnoCounter
#     in the samples readme's form, one head per job. Build only, like the template rows in
#     Uno.Templates' CI.
#
# This file is in upstream-sync.yml's KEEP list: the nightly sync switches off every workflow
# that isn't (src/Reactor.Uno/README.md, "Our workflows on this fork").

on:
  workflow_call:
    inputs:
      version:
        description: Version of the Uno.Microsoft.UI.Reactor package in the `NuGet` artifact.
        required: true
        type: string

permissions:
  contents: read

# Workflow-level env is not passed down from the caller.
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  file-based:
    name: desktop (file-based)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # src/Reactor.Uno for PackageReadme.md, which the script takes the #:sdk line from.
          sparse-checkout: |
            .github/scripts/uno
            samples/Uno/file-based
            src/Reactor.Uno

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: NuGet
          path: ${{ runner.temp }}/feed

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Run Counter.cs from the package
        run: >-
          ./.github/scripts/uno/smoke-package.ps1
          -Feed "${{ runner.temp }}/feed"
          -Version "${{ inputs.version }}"
          -WorkDir "${{ runner.temp }}/consumer"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-consume-file-based
          path: |
            ${{ runner.temp }}/consumer/*.binlog
            ${{ runner.temp }}/consumer/*.log
          if-no-files-found: ignore

  project:
    name: ${{ matrix.head }} (project)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - head: wasm
            framework: net10.0-browserwasm
            workload: wasm-tools
          - head: android
            framework: net10.0-android
            workload: android
          # Managed compile only: a device build needs a Mac, as in build-mobile.
          - head: ios
            framework: net10.0-ios
            workload: ios
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Cone mode also brings the files directly under samples/Uno (global.json).
          # src/Reactor.Uno for PackageReadme.md, which pins the Uno.Sdk.
          sparse-checkout: |
            .github/scripts/uno
            samples/Uno/ReactorUnoCounter
            src/Reactor.Uno

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: NuGet
          path: ${{ runner.temp }}/feed

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Install the ${{ matrix.workload }} workload
        run: dotnet workload install ${{ matrix.workload }}

      - name: Build the counter from the package
        run: >-
          ./.github/scripts/uno/build-package.ps1
          -Feed "${{ runner.temp }}/feed"
          -Version "${{ inputs.version }}"
          -Framework ${{ matrix.framework }}
          -WorkDir "${{ runner.temp }}/consumer"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-consume-${{ matrix.head }}
          path: ${{ runner.temp }}/consumer/*.binlog
          if-no-files-found: ignore
