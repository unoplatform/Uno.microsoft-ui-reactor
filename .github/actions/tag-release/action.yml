name: "Tag and push to GitHub"
description: "Tag the released commit with its nbgv version"

runs:
  using: "composite"
  steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      # nbgv computes the version height from the history; a shallow clone can't.
      fetch-depth: 0

  - name: Setup .NET SDK
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: '10.0.x'

  - uses: dotnet/nbgv@f088059084cb5d872e9d1a994433ca6440c2bf72 # v0.4.2
    name: NBGV
    id: nbgv
    with:
      toolVersion: 3.8.118
      setAllVars: true

  - name: "Tag and push to GitHub"
    shell: pwsh
    run: |
      git config user.email "info@platform.uno"
      git config user.name "Uno DevOps"
      git tag $env:NBGV_SemVer2
      git push origin $env:NBGV_SemVer2
